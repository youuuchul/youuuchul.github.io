name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: youuuchul/portfolio-site
          ref: main
          ssh-key: ${{ secrets.PORTFOLIO_SITE_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Release PDF 붙이기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f dist/portfolio_public.pdf
          gh release download pdf -R "$GITHUB_REPOSITORY" -p '*.pdf' -D dist || echo "Release PDF 없음"
          ls -la dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
