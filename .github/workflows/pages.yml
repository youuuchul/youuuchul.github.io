name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 사이트와 Release PDF 모으기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp index.html _site/
          gh release download pdf -R "$GITHUB_REPOSITORY" -p '*.pdf' -D _site || echo "Release PDF 없음"
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
